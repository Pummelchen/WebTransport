# The two Windows compiler variants Phase 12's matrix names (WT-260): MSVC and Clang-CL.
#
# DISPATCH-ONLY ON PURPOSE, while the job is being made to pass. `c99-ci.yml` runs on every push, and a job that
# cannot pass there teaches everyone to ignore CI; a manual run cannot break `main`. Once both variants are green
# here, the jobs move into `c99-ci.yml` and this file is deleted -- the plan is written down in WT-260 rather than
# left in somebody's head.
#
# What is new relative to the mingw legs already in CI: the COMPILER. `windows-wine` cross-compiles with mingw GCC
# and `windows-native` runs MSYS2's MINGW64 GCC, so both legs share one compiler; these two use `cl` and `clang-cl`
# against the same sources, the same CMake and the same CTest suite. OpenSSL comes from vcpkg, which the Windows
# runner image already carries, because that is the one MSVC-built OpenSSL a job can get without compiling it here.

name: Windows compiler probe (WT-260)

"on":
  workflow_dispatch:

jobs:
  msvc:
    name: C99 / Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # `cl` is not on PATH in a fresh step; this puts the Visual Studio developer environment there.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install OpenSSL 3 for MSVC (vcpkg)
        run: vcpkg install openssl:x64-windows

      - name: Configure
        run: >
          cmake -S C99 -B C99/out/msvc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DWEBTRANSPORT_C99_BUILD_APPS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build C99/out/msvc

      - name: Test
        run: ctest --test-dir C99/out/msvc --output-on-failure

  clang-cl:
    name: C99 / Windows (Clang-CL)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Clang-CL needs the MSVC headers and libraries, so the MSVC environment comes first and the compiler is
      # overridden on the CMake command line.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install OpenSSL 3 for MSVC (vcpkg)
        run: vcpkg install openssl:x64-windows

      - name: Configure
        run: >
          cmake -S C99 -B C99/out/clangcl -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-cl
          -DWEBTRANSPORT_C99_BUILD_APPS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build C99/out/clangcl

      - name: Test
        run: ctest --test-dir C99/out/clangcl --output-on-failure
