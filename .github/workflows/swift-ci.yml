name: Swift CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

# F-repo-ops-12: this workflow only reads the repository, so the token is given
# nothing else. A missing block means the repository default, which may include
# write scopes; naming the least privilege here keeps a compromised action from
# pushing.
permissions:
  contents: read

jobs:
  macos-swift:
    name: Xcode 27 / Swift 6.4 SwiftPM

    # F-repo-ops-01: the deliverable is built and audited on the mandated
    # toolchain (Swift 6.4 / Xcode 27), so CI must exercise that toolchain, not
    # whatever compiler the default macOS image happens to carry. `xcode-27` is
    # the GitHub-hosted image that provides Xcode 27 / Swift 6.4 for the macOS
    # targets this package declares, and the assertion below keeps a silent image
    # change from building green on the wrong compiler. The job stays blocking.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Blocking, and the only toolchain gate. `check-toolchain.sh` defaults to the
      # same floors the mandate names and the step passes them explicitly, so a
      # drifted default cannot silently lower the gate; it fails when
      # `swift --version` (or Xcode) is below Swift 6.4 / Xcode 27.
      - name: Assert mandated toolchain (Swift 6.4 / Xcode 27)
        run: ./Swift/check-toolchain.sh 6.4 27.0

      - name: Verify package manifests agree on shared targets
        run: ./Swift/check-manifest-sync.sh

      # Blocking. The Swift library and the C99 one ship together and must carry
      # the same version, so a caller pairing them knows the pair is compatible.
      # The value is single-sourced from VERSION and mirrored in the C99 header
      # and in WebTransportVersion.swift; this fails if any of the three drifts.
      # The C99 build's own configure fails on the same mismatch, so a C99-only
      # build cannot produce a library whose filename and answer disagree.
      # Bump with: ./Swift/check-version-sync.sh --write
      - name: Verify the two libraries report the same version
        run: ./Swift/check-version-sync.sh

      # Blocking. Each target's `import` statements must be covered by its own
      # declared dependencies; the manifests can agree with each other and still
      # both omit a module a target imports (A-0001/A-0006).
      - name: Verify every target's imports are declared as dependencies
        run: ./Swift/check-target-imports.sh

      # Blocking. The tree was reformatted in one pass so that this could become a
      # gate rather than a notice nobody reads. The two manifests are part of the
      # gate as well (A-0007): they are Swift source that SwiftPM compiles, and
      # excluding them was how 12 TrailingComma findings survived an otherwise
      # clean tree. Before pushing, run
      # `swift format --in-place --recursive Swift/Sources Swift/Tests Package.swift Swift/Package.swift`.
      - name: Lint formatting
        run: swift format lint --strict --recursive --parallel Swift/Sources Swift/Tests Package.swift Swift/Package.swift

      - name: Build both package entry points with safety diagnostics
        run: |
          swift build \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -require-explicit-sendable
          swift build --package-path Swift \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -require-explicit-sendable

      - name: Validate DocC catalog
        run: |
          set -euo pipefail
          rm -rf .build/symbol-graphs .build/docc
          mkdir -p .build/symbol-graphs .build/docc
          swift build \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc .build/symbol-graphs
          xcrun docc convert Swift/Sources/WebTransport/WebTransport.docc \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --output-dir .build/docc/WebTransport.doccarchive \
            --transform-for-static-hosting \
            --hosting-base-path WebTransport

      - name: Build public API compatibility sample
        run: ./check-api-compatibility.sh
        working-directory: Swift

      - name: Verify release artifacts
        run: ./build-release-apple-silicon.sh
        working-directory: Swift

      - name: Run package tests
        env:
          WEBTRANSPORT_REQUIRE_CLI_BINARIES: "1"
          WEBTRANSPORT_REQUIRE_RELEASE_ARTIFACTS: "1"
        run: >-
          swift test
          -Xswiftc -warnings-as-errors
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -require-explicit-sendable

      # F-repo-ops-16: the nested manifest's test targets that the root manifest also
      # declares compile the same sources -- `Swift/check-manifest-sync.sh` proves the
      # shared targets agree on path, type and dependencies -- so running the whole
      # nested suite would only duplicate the step above. Its ONE nested-only test
      # target is run here instead, and the nested manifest's two smoke executables,
      # which no workflow, test or script built or ran before, are executed against
      # each other by the script below.
      - name: Run the nested manifest's own test target
        run: swift test --package-path Swift --filter WebTransportTestSupportTests

      - name: Run the nested manifest's library smoke pair
        run: ./Swift/run-library-smoke.sh

      - name: Run client CLI conformance
        run: swift run WebTransportClient --scenario all

      - name: Run server CLI conformance
        run: swift run WebTransportServer --scenario all

  fuzz-peer-input:
    name: Fuzz peer-facing parsers / ASan
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The parsers here run on bytes from an unauthenticated peer, so a trap in
      # any of them is remotely reachable. The suite runs a small budget on every
      # build; this job runs a much larger one under AddressSanitizer, which
      # catches memory errors that do not trap on their own.
      - name: Fuzz under AddressSanitizer
        env:
          WEBTRANSPORT_FUZZ_ITERATIONS: "20000"
        run: >-
          swift test --sanitize=address
          --filter 'peerFacingParsers|huffmanDecoder'

  thread-sanitizer:
    name: Thread Sanitizer / in-process tests
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Excludes the CLI process and release-artifact suites: those orchestrate
      # subprocesses against wall-clock timeouts that TSan's ~20x slowdown blows
      # through, which reports as a timeout rather than a race. The in-process
      # runtime, protocol, and crypto tests are where the shared mutable state
      # actually lives, and they are what TSan can meaningfully check.
      - name: Run tests under Thread Sanitizer
        run: >-
          swift test --sanitize=thread
          --skip CLIProcess
          --skip ReleaseArtifacts
