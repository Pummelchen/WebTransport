# The C99 implementation's own CI, separate from the Swift job because the two
# share nothing but the repository: no toolchain overlap, no dependency overlap,
# and a failure in one should not mask the other.
#
# Four jobs, and the plan's Phase 12 list is what they are for. macOS 26 and Ubuntu
# 24.04 run the tree in CI as they always have -- the two matrix Linux legs are
# GitHub's `ubuntu-24.04` image (GCC and Clang) -- and `linux-debian13` runs the same
# suite in a `debian:trixie` container, so the plan's Debian 13 platform is a real
# second distribution rather than a renamed Ubuntu job. The FreeBSD leg is still to be
# added; and the Windows leg is here twice, because there are two different claims to
# make and only one of them needs a Windows machine:
#
#   * `windows-wine` cross-builds the whole tree with mingw on Linux and RUNS every
#     test executable under Wine. That is what found `WT-199` and `WT-200` -- a
#     datagram receive that mis-reported truncation and dropped the sender, and a
#     `WSARecvMsg` prototype this tree had written by hand with one parameter too
#     many, which no cross-compile could see. It runs in about four minutes on a
#     hosted runner.
#   * `windows-native` builds and tests on a real Windows machine with MSYS2's
#     MINGW64 toolchain. Wine is a faithful Win32 implementation, not Windows, so
#     this is the job that settles what Wine cannot: the extension function Wine
#     happens to answer correctly, the platform trust store, and the loader's own
#     DLL search. It is ENFORCED as of `F-repo-ops-26`: the job was advisory only
#     because the build staged the shared DLL from 90 executables at once and the
#     loser of that Ninja race failed with `Permission denied`, which is not a
#     Windows defect. With one sequential staging edge there is no such reason left
#     (WT-224).
#
# See C99/docs/PORTABILITY.md for what each of those does and does not prove.

name: C99 CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: c99-ci-${{ github.ref }}
  cancel-in-progress: true

# F-repo-ops-12: this workflow only reads the repository, so the token is given
# nothing else. A missing block means the repository default, which may include
# write scopes; naming the least privilege here keeps a compromised action from
# pushing.
permissions:
  contents: read

jobs:
  build-and-test:
    name: C99 / ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            cc: clang
          - os: ubuntu-24.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The workflow files themselves, checked before anything else runs: a step with two `env:` blocks is a
      # workflow GitHub rejects outright, and the failure has no job list and only "This run likely failed because
      # of a workflow file issue" to go on. `check-workflows.py` refuses a repeated key, which `yaml.safe_load`
      # silently accepts -- and a checker nothing runs is a checker nobody has tested.
      - name: The workflow files parse and have no duplicate keys
        if: runner.os == 'Linux'
        run: python3 C99/scripts/check-workflows.py .github/workflows

      - name: Install Ninja
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi

      # A mingw cross-compiler is the only way this project can check its `_WIN32` branch without a Windows
      # runner: it says whether the branch COMPILES, which is a smaller claim than "the port works" and a much
      # larger one than "written from the inventory". Failing the install falls through to the check's own
      # "unsupported" line rather than failing the job, because the POSIX build is what this project ships.
      - name: Install a Windows cross-compiler
        continue-on-error: true
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64
          else
            brew install mingw-w64
          fi

      # The warnings are part of the contract, not advice: this build turns them
      # into errors for this project's sources, so a narrowing conversion or an
      # unchecked length arithmetic fails here rather than at run time on a
      # peer's packet. -Wconversion is the flag that does most of that work.
      - name: Configure and build
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S C99 -B C99/out/ci/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWEBTRANSPORT_C99_BUILD_APPS=ON
          cmake --build C99/out/ci/build

      - name: Unit tests
        run: ctest --test-dir C99/out/ci/build --output-on-failure

      # The RFC vectors are generated, and this is what keeps them generated: the
      # extractors re-derive every value from the RFC text and fail if the
      # committed header is not what the document says. A test that passes against
      # a hand-edited vector is worse than no test, and nothing else would notice.
      - name: RFC vectors match the documents
        run: C99/scripts/check-vectors.sh

      - name: Release build
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S C99 -B C99/out/ci/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build C99/out/ci/release

      # The same tests under AddressSanitizer and UndefinedBehaviorSanitizer.
      # A separate configuration because CMake caches compiler flags: enabling
      # sanitizers in a directory that was configured without them does nothing.
      - name: Sanitizer build and tests
        if: matrix.cc == 'clang'
        # One env block, because a step with two of them is a workflow file
        # GitHub rejects outright -- the run fails before any job exists, with
        # no job list and only "This run likely failed because of a workflow
        # file issue" to go on. PyYAML accepted it silently, taking the last
        # key, which is why the local check did not catch it.
        env:
          CC: ${{ matrix.cc }}
          # LeakSanitizer runs at exit on Linux and is where a leak in this
          # project is caught: this job's first run found a 4-byte leak in a test
          # that had passed every assertion. Darwin's AddressSanitizer has no
          # LeakSanitizer and aborts the process if asked for one -- "detect_leaks
          # is not supported on this platform" -- so the option is set on Linux
          # only, exactly as scripts/build-and-test.sh does it. Setting it for
          # every leg failed all ten macOS tests on the first attempt at this
          # fix, which is how the two places came to agree.
          ASAN_OPTIONS: ${{ runner.os == 'Linux' && 'detect_leaks=1' || '' }}
        run: |
          cmake -S C99 -B C99/out/ci/sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWEBTRANSPORT_C99_SANITIZE=ON
          cmake --build C99/out/ci/sanitize
          ctest --test-dir C99/out/ci/sanitize --output-on-failure

      # The install tree is the interface a consumer sees, so it is checked by
      # building a consumer against it rather than by looking at the files.
      - name: Package consumer
        run: C99/scripts/check-package.sh
      - name: Check the compliance matrix against the tree
        # A matrix that names functions nobody wrote is worse than no matrix, because it reads like
        # evidence: this greps every symbol it names and fails if one is missing.
        run: C99/scripts/check-matrix.sh
      - name: Check the portability inventory against the tree
        # The inventory lists what a Windows or FreeBSD build needs; this fails if the library uses a POSIX-only
        # call the inventory does not name, which is how such a document stays true.
        run: C99/scripts/check-portability.sh
      - name: Run the Clang Static Analyzer over the library and the tools
        # Phase 13 asks for static analysis, and the Definition of Done's "sanitizers and static checks are clean"
        # criterion was carried by warnings-as-errors alone: this is symbolic execution over every source, which
        # finds the use-after-free or the null dereference on a branch no test takes. It reuses the build's own
        # compile commands, so the include paths and defines are the ones the code is really compiled with. A
        # runner without clang reports "unsupported" (exit 3) rather than passing quietly.
        run: C99/scripts/check-static-analysis.sh
      - name: Run cppcheck over the library and the tools
        # The second engine, and the one the plan names: cppcheck is a different analyser with different
        # heuristics, and it finishes in seconds. The style category is off on purpose -- its cross-translation-unit
        # heuristics report a library's public API as static-able and another unit's reads as unread -- and the
        # script says so. A runner without cppcheck reports "unsupported" rather than passing quietly.
        run: C99/scripts/check-cppcheck.sh
      - name: Fetch a Windows OpenSSL
        # Before the two Windows checks rather than only before the link, because the compile check wants the
        # TARGET's OpenSSL headers: on a Linux runner the only other ones are the host's, and a cross-compile
        # handed `-I /usr/include` resolves `stdint.h` to the host's copy and then asks for
        # `bits/libc-header-start.h`, which a Windows target does not have. The script falls back to host headers
        # searched after the target's (`-idirafter`) on a machine without this prefix. Pinned so the job does not
        # move under the project's feet.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y zstd
          curl -sL -o /tmp/mingw-openssl.pkg.tar.zst \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-openssl-3.6.4-1-any.pkg.tar.zst
          zstd -d -f /tmp/mingw-openssl.pkg.tar.zst -o /tmp/mingw-openssl.tar
          mkdir -p /tmp/windows-openssl && tar -xf /tmp/mingw-openssl.tar -C /tmp/windows-openssl
      - name: Compile the Windows platform branch
        # The _WIN32 branch of udp_platform.h was written from the inventory. A cross-compiler is enough to say
        # it compiles -- and it found FIONBIO not fitting a signed long on its first run. A machine without a
        # cross-compiler reports "unsupported" with that reason instead of failing.
        run: C99/scripts/check-windows-platform.sh
      - name: Link the whole tree for Windows
        # The stronger claim: every test and app becomes a PE32+ executable, which is what a Windows runner
        # needs before it is worth adding. It uses the Windows OpenSSL the step above unpacked -- no MSYS2
        # installation, no Windows runner, and the compiler that checks it is the same one the compile step uses.
        #
        # ENFORCED, and Linux-only. It was `continue-on-error` while nobody had seen it finish; it has now been
        # run to completion -- 91 PE32+ executables and a shared library -- so a failure here is a real one.
        if: runner.os == 'Linux'
        run: WT_WINDOWS_OPENSSL=/tmp/windows-openssl/mingw64 C99/scripts/check-windows-build.sh

      - name: CLI smoke
        run: |
          C99/out/ci/build/apps/wt-client-c99 --version
          C99/out/ci/build/apps/wt-server-c99 --help >/dev/null
          # An unimplemented tool must not exit 0, or a script would read a stub
          # as a successful run.
          if C99/out/ci/build/apps/wt-client-c99 >/dev/null 2>&1; then
            echo "wt-client-c99 exited 0 with no protocol implemented" >&2
            exit 1
          fi

  # The Python rule set, in one place rather than repeated on three matrix legs. Python
  # here is test and glue code (Tier C in AUDIT/inventory.md), so the standard keeps it
  # cheap: one pinned Ruff, `--fix` available to a contributor, and the rules the audit
  # standard names (B, E722, S101, PT) enabled in the committed `ruff.toml`. A config
  # nothing runs is not a standard, which is exactly what AUD-0007 recorded.
  python-lint:
    name: Python / Ruff
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the pinned Ruff
        run: |
          set -euo pipefail
          command -v ruff >/dev/null || python3 -m pip install --user 'ruff==0.16.7'
          ruff --version

      - name: Lint the Python
        run: ruff check .

      - name: Check the Python is formatted
        run: ruff format --check .

  # AUD-0010. A formatting gate is only meaningful with ONE formatter version: clang-format's
  # output changes between releases, so running it on every matrix leg would fail on whichever
  # leg happened to ship a different one -- and "reformat the tree to satisfy today's Ubuntu"
  # is not a standard. The version is pinned to the one the audit ran, and PyPI publishes the
  # LLVM-matched builds, so the gate is the same tool on the same input everywhere.
  #
  # It is its own job rather than a matrix step for that reason, exactly as `python-lint` is.
  format:
    name: C99 / formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the pinned clang-format
        run: |
          set -euo pipefail
          command -v clang-format >/dev/null || python3 -m pip install --user 'clang-format==23.1.1'
          clang-format --version

      - name: Check the tree matches .clang-format
        run: C99/scripts/check-format.sh

  # AUD-0009: the audit baseline needs a coverage number for the C99 library, and before this
  # job the tree could not produce one. It is a report rather than a threshold gate -- a
  # threshold is a policy decision the repository has not made -- but it fails if the
  # measurement itself breaks, which is what keeps the number from quietly becoming a zero.
  coverage:
    name: C99 / coverage
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Ninja and CMake
        run: brew install ninja cmake

      - name: Measure the library's line coverage
        run: ./C99/scripts/measure-coverage.sh

  # A second Linux DISTRIBUTION, not a renamed Ubuntu job (WT-225). The plan's Phase 12 matrix names Debian 13
  # and every other Linux leg runs GitHub's `ubuntu-24.04` image, so nothing here would notice what Debian
  # ships: a different GCC, a different OpenSSL 3 minor, or a libc that changes what the portability inventory
  # has to cover. The container is the `trixie` (Debian 13) tag -- a container image is not a `uses:` action, so
  # there is no SHA to pin, and the toolchain comes from the distribution's own archive rather than from a
  # setup action, which is the point of running the leg at all.
  linux-debian13:
    name: C99 / Debian 13 (trixie, gcc)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      # `actions/checkout` runs INSIDE the container, so the container's own `git` is what clones: the Debian
      # base image ships none, and the runner's bundled Node does not stand in for it.
      - name: Install git for the checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install cmake, Ninja, GCC and OpenSSL 3
        # The Ubuntu legs inherit a toolchain from their runner image; this one starts from the bare Debian
        # image, so it has to name every part of the toolchain it uses.
        #
        # `libc6-dev` is named explicitly because on Debian `gcc` only RECOMMENDS it: with
        # `--no-install-recommends` the C runtime's startup objects are missing, and the failure is CMake's
        # compiler check rather than anything in this tree --
        # `/usr/bin/ld: cannot find Scrt1.o` / `crti.o`, "Check for working C compiler: /usr/bin/cc - broken".
        # That is exactly how the first run of this leg failed, which is why the package is here now.
        # `libssl-dev` is OpenSSL 3 on trixie, which is what `find_package(OpenSSL 3.0 REQUIRED)` needs.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build gcc libc6-dev libssl-dev

      - name: Configure and build
        run: |
          cmake -S C99 -B C99/out/ci/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWEBTRANSPORT_C99_BUILD_APPS=ON
          cmake --build C99/out/ci/build

      - name: Unit tests
        run: ctest --test-dir C99/out/ci/build --output-on-failure

  # The plan's Phase 12 names FreeBSD, GitHub provides no FreeBSD runner, and the platform was
  # therefore measured by hand -- on a real kernel, but as a measurement that no pull request
  # could fail on (WT-223). This boots FreeBSD in a VM on an Ubuntu runner, which is the same
  # mechanism the hand measurement used, so a FreeBSD-only regression can now fail a PR.
  freebsd:
    name: C99 / FreeBSD (VM, clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          usesh: true
          # python3 is the harness dependency the first hand-run found the hard way (WT-201);
          # everything else is the same toolchain the Linux legs use, from FreeBSD's packages.
          # OpenSSL 3 and the C compiler come from the base system, which is what the CMake
          # configure looks for.
          prepare: |
            pkg install -y cmake ninja python3
          run: |
            cmake -S C99 -B C99/out/ci/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DWEBTRANSPORT_C99_BUILD_APPS=ON
            cmake --build C99/out/ci/build
            ctest --test-dir C99/out/ci/build --output-on-failure

  # The Windows leg, RUN rather than linked: the cross-build above says the tree compiles and links for Windows,
  # and this says it EXECUTES there. It runs the binaries through Wine on Linux, which is as far as a hosted
  # runner without Windows can take it -- `windows-native` below is the job that goes further.
  windows-wine:
    name: C99 / Windows (mingw cross-build, run under Wine)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Ninja, the cross-compiler, Wine and zstd
        # `wine64` is the package Ubuntu ships and the binary inside it is /usr/lib/wine/wine64 -- there is no
        # `wine64` on PATH, which is why C99/scripts/check-windows-wine.sh looks for that exact path. zstd
        # unpacks the Windows OpenSSL below.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-mingw-w64-x86-64 wine64 zstd

      - name: Fetch a Windows OpenSSL
        # The same pinned package the Linux matrix uses, for the same reason: the compile check wants the
        # TARGET's headers and the cross-link wants its import libraries, and a version that moves under the
        # project's feet would turn a portability check into a version check.
        run: |
          curl -sL -o /tmp/mingw-openssl.pkg.tar.zst \
            https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-openssl-3.6.4-1-any.pkg.tar.zst
          zstd -d -f /tmp/mingw-openssl.pkg.tar.zst -o /tmp/mingw-openssl.tar
          mkdir -p /tmp/windows-openssl && tar -xf /tmp/mingw-openssl.tar -C /tmp/windows-openssl

      - name: Compile the Windows platform branch
        run: C99/scripts/check-windows-platform.sh
        env:
          WT_WINDOWS_OPENSSL: /tmp/windows-openssl/mingw64

      - name: Link the whole tree for Windows
        run: C99/scripts/check-windows-build.sh
        env:
          WT_WINDOWS_OPENSSL: /tmp/windows-openssl/mingw64

      - name: Run the whole suite under Wine
        # Every linked test executable, bounded per test so a hang is reported as a hang rather than as a jobs
        # timeout. This is the step that turns "linked for Windows" into "runs on Windows", and it is the step
        # that found WT-199 and WT-200.
        run: C99/scripts/check-windows-wine.sh
        env:
          WT_WINDOWS_OPENSSL: /tmp/windows-openssl/mingw64
          WT_WINDOWS_WINE_TIMEOUT: "60"

  # A REAL Windows machine, because Wine is a faithful Win32 implementation and not Windows. MSYS2's MINGW64
  # toolchain is the same GCC the cross-build uses, so the code compiles under the same warning set; what is new
  # here is the operating system underneath it: the provider's own `WSARecvMsg`, the Windows certificate store
  # behind `--trust system`, the loader's DLL search, and Winsock's own error numbers.
  windows-native:
    name: C99 / Windows (native, MSYS2 MINGW64)
    runs-on: windows-latest
    # ENFORCED (WT-224). It was advisory because the build raced 90 POST_BUILD copies of `libwebtransport.dll`
    # into two output directories, so it could fail with `Permission denied` for reasons that had nothing to do
    # with Windows; F-repo-ops-26 replaced those with one sequential staging edge on the shared library. A
    # Windows-only regression can now fail the pull request, which is what this leg is for.
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up MSYS2 with the MINGW64 toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-python

      - name: Check the toolchain
        run: |
          gcc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Make sure the CLI checks can find python3
        # The three `check-cli-*.sh` scripts PARSE the tools' JSON reports with `python3` (WT-144) and skip with a
        # reason when it is absent (WT-201). MSYS2's mingw python installs `python.exe`; a `python3.exe` beside it
        # is what those scripts look for, and creating one is cheaper than teaching three scripts about a naming
        # difference between platforms.
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
          fi
          python3 --version

      - name: Configure and build
        run: |
          cmake -S C99 -B C99/out/windows-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEBTRANSPORT_C99_BUILD_APPS=ON
          cmake --build C99/out/windows-native

      - name: Measure what this platform's socket calls do
        # The two probes the library's comments quote -- the `recvfrom` fallback's semantics and the `WSARecvMsg`
        # prototype's arity -- compiled and RUN on real Windows, so their output is evidence a reader can compare
        # with the Wine output they were written from. They assert nothing: this step exists because Wine and
        # Windows are not the same provider, and the first native run proved it (a peek of a datagram that exactly
        # fits the buffer left the queue empty here and did not under Wine).
        run: |
          mkdir -p C99/out/windows-native/probes
          for probe in recvfrom recvmsg-arity; do
            gcc "C99/tests/windows/probe-$probe.c" -o "C99/out/windows-native/probes/probe-$probe.exe" -lws2_32
            echo "=== probe-$probe ==="
            "C99/out/windows-native/probes/probe-$probe.exe" || echo "(probe exited $?)"
          done

      - name: Unit tests
        run: ctest --test-dir C99/out/windows-native --output-on-failure

      - name: Compile the portability inventory check too
        # The inventory is checked against the tree here as well, because this is the platform it is about.
        run: C99/scripts/check-portability.sh

  # The two Windows COMPILERS Phase 12's matrix names, and the reason they were missing: both Windows legs above
  # use mingw GCC, so `cl` and `clang-cl` had never built this tree even though every other platform in the matrix
  # had a job. They run the same sources, the same CMake and the same CTest suite as the mingw legs; what is new is
  # the compiler. Making them pass found seven defects (WT-260), every one of them invisible to GCC and to Clang on
  # POSIX: a static archive and a DLL import library claiming one file name, an uninitialized `const` object, the
  # MSVC CRT's deprecation of portable C, a libFuzzer probe that tested flags it did not apply, a DLL that exported
  # nothing (mingw's `--export-all-symbols` had been exporting it by accident), a DATA symbol's consumer needing
  # `dllimport`, and a corpus helper that is unused where the corpus is compiled out.
  #
  # OpenSSL comes from vcpkg, which the Windows runner image already carries -- the one MSVC-built OpenSSL a job
  # can get without compiling it here. Each job takes about twelve minutes, most of it vcpkg and the test run.
  msvc:
    name: C99 / Windows (MSVC, native)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # `cl` is not on PATH in a fresh step; this puts the Visual Studio developer environment there.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install OpenSSL 3 for MSVC (vcpkg)
        run: vcpkg install openssl:x64-windows

      - name: Configure
        run: >
          cmake -S C99 -B C99/out/msvc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DWEBTRANSPORT_C99_BUILD_APPS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build C99/out/msvc

      - name: Test
        run: ctest --test-dir C99/out/msvc --output-on-failure

  clang-cl:
    name: C99 / Windows (Clang-CL, native)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Clang-CL needs the MSVC headers and libraries, so the MSVC environment comes first and the compiler is
      # overridden on the CMake command line.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install OpenSSL 3 for MSVC (vcpkg)
        run: vcpkg install openssl:x64-windows

      - name: Configure
        run: >
          cmake -S C99 -B C99/out/clangcl -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-cl
          -DWEBTRANSPORT_C99_BUILD_APPS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build C99/out/clangcl

      - name: Test
        run: ctest --test-dir C99/out/clangcl --output-on-failure
