# gitleaks configuration for this repository.
#
# The `secret-scan` job in `.github/workflows/security-scan.yml` runs
# `gitleaks git` over the FULL history (the checkout sets `fetch-depth: 0` for
# exactly that reason). This file keeps the default rule set and adds only the
# allowlists the audit's full-history run needed; a finding that is not one of
# these two audited false-positive classes still fails the job.
#
# Audit evidence: AUDIT/findings/repo-ops.md, "Scanner runs" -- gitleaks 8.30.1
# over the full history (588 commits at the time of this change) reported nine
# findings, all of them accounted for below.

[extend]
useDefault = true

# 1. The three private keys under the trust directory are test fixtures, not
#    credentials. C99/tests/vectors/trust/README.md documents them as "for tests
#    and for nothing else", C99/tests/vectors/trust/make-fixtures.sh regenerates
#    them, and nothing in the tree trusts them.
[[allowlists]]
description = "Test-only TLS trust fixtures (C99/tests/vectors/trust/README.md): regenerated by make-fixtures.sh, trusted by nothing."
paths = ['''^C99/tests/vectors/trust/''']

# 2. The `generic-api-key` rule fires six times on one Swift enum case name in a
#    test: the reported "secret" is the literal `.ellipticCurveP256`, read from a
#    `keyKind:` label. Path AND secret must both match, so no other file and no
#    other value is waived.
[[allowlists]]
description = "generic-api-key false positive on the Swift enum label `.ellipticCurveP256` in the server-identity tests (AUDIT/findings/repo-ops.md, Scanner runs)."
condition = "AND"
paths = ['''^Swift/Tests/WebTransportNetworkRuntimeTests/WebTransportServerIdentityTests\.swift$''']
regexes = ['''^\.ellipticCurveP256$''']
